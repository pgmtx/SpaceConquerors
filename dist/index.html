<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space Conquerors</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: 'Courier New', monospace; color: #00ffcc; }

    #canvas-container {
      position: fixed; inset: 0;
    }

    /* ── TOP BAR ───────────────────────────────── */
    #hud-top {
      position: fixed; top: 0; left: 0; right: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 16px;
      background: linear-gradient(180deg, rgba(0,10,20,0.95) 0%, rgba(0,10,20,0) 100%);
      pointer-events: none; z-index: 10;
    }
    #team-info {
      display: flex; align-items: center; gap: 12px;
    }
    #team-name {
      font-size: 18px; font-weight: bold;
      color: #00ffcc; text-shadow: 0 0 10px #00ffcc;
      letter-spacing: 2px;
    }
    #team-score {
      font-size: 13px; color: #88ffdd; background: rgba(0,255,204,0.1);
      padding: 2px 8px; border: 1px solid rgba(0,255,204,0.3); border-radius: 4px;
    }
    #resources {
      display: flex; gap: 12px; align-items: center;
    }
    .resource-chip {
      display: flex; align-items: center; gap: 4px;
      font-size: 12px; padding: 3px 8px;
      background: rgba(0,20,40,0.8); border: 1px solid rgba(0,150,200,0.4);
      border-radius: 4px; color: #aaddff;
    }
    .resource-chip .icon { font-size: 14px; }
    #coords-display {
      font-size: 12px; color: #557799; letter-spacing: 1px;
    }
    #refresh-btn {
      font-family: 'Courier New', monospace;
      font-size: 12px; letter-spacing: 1px;
      padding: 5px 14px;
      background: rgba(0,60,100,0.7); border: 1px solid rgba(0,200,255,0.6);
      color: #00ffcc; border-radius: 4px; cursor: pointer;
      transition: all 0.15s; pointer-events: all;
    }
    #refresh-btn:hover:not(:disabled) {
      background: rgba(0,100,160,0.9); box-shadow: 0 0 8px rgba(0,255,204,0.3);
    }
    #refresh-btn:disabled { opacity: 0.5; cursor: wait; }

    /* ── MINIMAP ───────────────────────────────── */
    #minimap-container {
      position: fixed; bottom: 20px; left: 20px;
      background: rgba(0,10,20,0.9); border: 1px solid rgba(0,150,200,0.5);
      border-radius: 6px; padding: 6px; z-index: 10;
    }
    #minimap-title {
      font-size: 9px; color: #557799; text-align: center; letter-spacing: 2px;
      margin-bottom: 4px;
    }
    #minimap { cursor: crosshair; display: block; }

    /* ── LEADERBOARD ───────────────────────────── */
    #leaderboard {
      position: fixed; top: 60px; right: 20px; width: 240px;
      background: rgba(0,10,20,0.9); border: 1px solid rgba(0,150,200,0.4);
      border-radius: 6px; padding: 10px; z-index: 10;
    }
    #leaderboard h3 {
      font-size: 11px; letter-spacing: 3px; color: #557799;
      text-align: center; margin-bottom: 8px; text-transform: uppercase;
    }
    .lb-row {
      display: flex; align-items: center; gap: 6px;
      padding: 4px 4px; border-radius: 3px; margin-bottom: 2px;
      font-size: 11px; transition: background 0.2s;
    }
    .lb-row:hover { background: rgba(0,100,150,0.2); }
    .lb-rank { color: #557799; width: 18px; text-align: right; font-size: 10px; }
    .lb-color { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .lb-name { flex: 1; color: #aaddff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lb-pts { color: #00ffcc; font-size: 11px; font-weight: bold; }
    .lb-row.my-team { background: rgba(0,255,204,0.08); border: 1px solid rgba(0,255,204,0.2); }
    .lb-row.my-team .lb-name { color: #00ffcc; }

    /* ── INFO PANEL ────────────────────────────── */
    #info-panel {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      min-width: 380px; max-width: 600px;
      background: rgba(0,10,20,0.95); border: 1px solid rgba(0,150,200,0.5);
      border-radius: 8px; padding: 12px 16px; z-index: 10;
      display: none;
    }
    #info-panel.visible { display: block; }
    #info-panel-title {
      font-size: 14px; font-weight: bold; color: #00ffcc;
      letter-spacing: 1px; margin-bottom: 8px;
      display: flex; align-items: center; justify-content: space-between;
    }
    #info-close {
      cursor: pointer; font-size: 16px; color: #557799;
      pointer-events: all; padding: 0 4px;
    }
    #info-close:hover { color: #ff4466; }
    #info-body {
      font-size: 12px; display: flex; gap: 20px;
    }
    .info-col { flex: 1; }
    .info-row { display: flex; justify-content: space-between; padding: 2px 0; }
    .info-label { color: #557799; }
    .info-value { color: #aaddff; }
    .info-value.good { color: #00ffcc; }
    .info-value.bad { color: #ff4466; }

    /* ── ACTIONS ───────────────────────────────── */
    #actions-panel {
      margin-top: 10px; display: none;
      border-top: 1px solid rgba(0,150,200,0.3); padding-top: 10px;
    }
    #actions-panel.visible { display: block; }
    #actions-title { font-size: 10px; color: #557799; letter-spacing: 2px; margin-bottom: 6px; }
    #actions-buttons { display: flex; flex-wrap: wrap; gap: 6px; }
    .action-btn {
      font-family: 'Courier New', monospace;
      font-size: 11px; padding: 4px 10px;
      background: rgba(0,80,120,0.5); border: 1px solid rgba(0,150,200,0.6);
      color: #aaddff; border-radius: 4px; cursor: pointer;
      pointer-events: all; transition: all 0.15s; letter-spacing: 1px;
    }
    .action-btn:hover { background: rgba(0,120,180,0.7); color: #fff; border-color: #00aaff; }
    .action-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .action-btn.cooldown { border-color: rgba(255,150,0,0.5); color: #ffaa44; }

    /* ── STATS PANEL ───────────────────────────── */
    #stats-panel {
      position: fixed; top: 60px; left: 20px; width: 200px;
      background: rgba(0,10,20,0.9); border: 1px solid rgba(0,150,200,0.4);
      border-radius: 6px; padding: 10px; z-index: 10;
    }
    #stats-panel h3 {
      font-size: 11px; letter-spacing: 3px; color: #557799;
      margin-bottom: 8px; text-transform: uppercase;
    }
    .stat-bar-row { margin-bottom: 6px; }
    .stat-bar-label {
      display: flex; justify-content: space-between;
      font-size: 10px; color: #557799; margin-bottom: 2px;
    }
    .stat-bar-label span:last-child { color: #aaddff; }
    .stat-bar-track {
      height: 4px; background: rgba(0,50,80,0.8);
      border-radius: 2px; overflow: hidden;
    }
    .stat-bar-fill {
      height: 100%; border-radius: 2px; transition: width 0.8s ease;
    }
    .stat-bar-fill.ships { background: linear-gradient(90deg, #0080ff, #00ffcc); }
    .stat-bar-fill.planets { background: linear-gradient(90deg, #8800ff, #ff00aa); }
    .stat-bar-fill.credits { background: linear-gradient(90deg, #ffaa00, #ffff00); }
    .stat-bar-fill.minerai { background: linear-gradient(90deg, #ff4400, #ffaa00); }

    /* ── NAV HINT ──────────────────────────────── */
    #nav-hint {
      position: fixed; bottom: 20px; right: 20px;
      font-size: 10px; color: rgba(0,150,200,0.6);
      text-align: right; pointer-events: none; z-index: 10;
      line-height: 1.8;
    }

    /* ── NOTIFICATIONS ─────────────────────────── */
    #notifications {
      position: fixed; top: 60px; left: 50%; transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      z-index: 20; pointer-events: none;
    }
    .notif {
      background: rgba(0,20,40,0.95); border: 1px solid rgba(0,200,255,0.5);
      color: #aaddff; font-size: 12px; padding: 6px 16px; border-radius: 4px;
      animation: notifIn 0.3s ease, notifOut 0.5s ease 2.5s forwards;
    }
    .notif.error { border-color: rgba(255,50,50,0.5); color: #ff8888; }
    .notif.success { border-color: rgba(0,255,100,0.5); color: #88ff99; }
    @keyframes notifIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes notifOut { from { opacity: 1; } to { opacity: 0; } }

    /* ── LOADING ───────────────────────────────── */
    #loading {
      position: fixed; inset: 0; background: #000;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 100;
    }
    #loading h1 {
      font-size: 36px; letter-spacing: 8px; color: #00ffcc;
      text-shadow: 0 0 20px #00ffcc, 0 0 40px #00ffcc;
      margin-bottom: 20px;
    }
    #loading-bar-track {
      width: 300px; height: 4px; background: rgba(0,50,80,0.8); border-radius: 2px;
    }
    #loading-bar-fill {
      height: 100%; background: linear-gradient(90deg, #0080ff, #00ffcc);
      border-radius: 2px; transition: width 0.3s ease;
      box-shadow: 0 0 8px #00ffcc;
    }
    #loading-status { margin-top: 12px; font-size: 12px; color: #557799; letter-spacing: 2px; }
  </style>
  <script type="module" crossorigin src="/assets/index-wQFRQqxW.js"></script>
</head>
<body>
  <div id="loading">
    <h1>SPACE CONQUERORS</h1>
    <div id="loading-bar-track"><div id="loading-bar-fill" style="width:0%"></div></div>
    <div id="loading-status">INITIALISATION...</div>
  </div>

  <div id="canvas-container"></div>

  <div id="hud-top">
    <div id="team-info">
      <div id="team-name">MAKE-ENSIM-GREAT-AGAIN</div>
      <div id="team-score">⭐ 0 pts</div>

    <div class="stat-bar-row">

      <div class="stat-bar-track"><div class="stat-bar-fill ships" id="stat-ships-bar" style="width:0%"></div></div>

    <div class="stat-bar-row">
      <div class="stat-bar-label"><span>PLANÈTES</span><span id="stat-planets-val">0</span></div>
      <div class="stat-bar-track"><div class="stat-bar-fill planets" id="stat-planets-bar" style="width:0%"></div></div>
    </div>
    <div class="stat-bar-row">
      <div class="stat-bar-label"><span>CRÉDITS</span><span id="stat-credits-val">0</span></div>
      <div class="stat-bar-track"><div class="stat-bar-fill credits" id="stat-credits-bar" style="width:0%"></div></div>
    </div>
    <div class="stat-bar-row">
      <div class="stat-bar-label"><span>MINERAI</span><span id="stat-minerai-val">0</span></div>
      <div class="stat-bar-track"><div class="stat-bar-fill minerai" id="stat-minerai-bar" style="width:0%"></div></div>
    </div>
  </div>

  <div id="leaderboard">
    <h3>◈ Classement</h3>
    <div id="leaderboard-list"></div>
  </div>

  <div id="minimap-container">
    <div id="minimap-title">CARTE GLOBALE</div>
    <canvas id="minimap" width="174" height="174"></canvas>
  </div>

  <div id="info-panel">
    <div id="info-panel-title">
      <span id="info-title">--</span>
      <span id="info-close">✕</span>
    </div>
    <div id="info-body">
      <div class="info-col" id="info-col-1"></div>
      <div class="info-col" id="info-col-2"></div>
    </div>
    <div id="actions-panel">
      <div id="actions-title">◈ ACTIONS DISPONIBLES</div>
      <div id="actions-buttons"></div>
    </div>
  </div>

  <div id="notifications"></div>

  <div id="nav-hint">
    WASD / ↑↓←→ Déplacer<br>
    Molette: Zoom<br>
    Clic: Sélectionner<br>
    ESC: Fermer
  </div>

</body>
</html>
